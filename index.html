<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felix検査App ホーム</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16324F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Felix検査">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="common.css">
<style>
  .brand{display:flex;flex-direction:column;align-items:center;margin:14px 0 18px}
  .brand img{width:76px;height:76px;border-radius:18px;box-shadow:0 6px 18px #16324f40}
  .brand b{font-size:21px;color:var(--navy);margin-top:10px;font-weight:900;letter-spacing:.02em}
  .brand small{color:var(--gray);font-size:13px;margin-top:2px}
  .logo{text-align:center;color:var(--navy);font-weight:900;font-size:19px;margin:6px 0 4px}
  .sub{text-align:center;color:var(--gray);font-size:13px;margin-bottom:20px}
  .role{display:flex;align-items:center;gap:12px;width:100%;max-width:380px;margin:12px auto;padding:18px 20px;font-size:17px;font-weight:700;color:#fff;border:none;border-radius:14px;box-shadow:0 4px 12px #16324f33;font-family:inherit;text-align:left}
  .role .ic{font-size:26px}
  .cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .cnt>*{border-radius:14px;padding:12px 8px;text-align:center;text-decoration:none;display:block}
  .cnt b{display:block;font-size:26px;font-weight:900;line-height:1.2}
  .cnt small{font-size:11px;color:var(--gray);font-weight:700}
  .cnt.one{grid-template-columns:1fr}
  .menu{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px 16px;margin:10px 0;border-radius:14px;background:#fff;border:1px solid var(--line);color:var(--navy);font-size:17px;font-weight:700;text-decoration:none}
  .menu .ic{font-size:26px;flex:none;width:34px;text-align:center}
  .menu small{display:block;font-size:12px;font-weight:400;opacity:.8;margin-top:2px}
  .menu.main{background:var(--navy);color:#fff;border-color:var(--navy);padding:22px 18px;font-size:19px}
  .menu.resume{background:#fff3cd;border-color:#ecd58a;color:#6b5400;font-size:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2 .menu{flex-direction:column;text-align:center;gap:6px;margin:0;padding:18px 8px;font-size:15px}
  .grid2 .menu .ic{width:auto}
  .grid2 .menu.wide{grid-column:1/-1;flex-direction:row;justify-content:center}
  .foot{display:flex;flex-direction:column;gap:8px;margin-top:18px}
</style>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header><h1>Felix検査App</h1></header>
<main>
  <div id="view"></div>
</main>
<script src="templates.js"></script>
<script src="common.js"></script>
<script>
const view=$("#view");
document.body.insertAdjacentHTML("beforeend",`<div id="toast"></div>`);
const FRESH_MS=12*3600*1000;
const isMenuNav=/[?&]m=1/.test(location.search);   // メニューから来た場合は自動で前回の画面へ移動しない

const BRAND=`<div class="brand"><img src="icon-192.png" alt=""><b>Felix検査App</b><small>現場の検査と是正をひとつに</small></div>`;
function renderLogin(){
  document.documentElement.classList.remove("big");
  view.innerHTML=`${BRAND}<div class="logo">ログインアカウントの選択</div><div class="sub">※一度選択すると、次回以降はこの画面をスキップして開きます。</div>
    <button class="role" style="background:#16324F" data-r="admin"><span class="ic">💻</span>管理者として入室</button>
    <button class="role" style="background:#2C4F78" data-r="partner" data-a="東海エリア"><span class="ic">🛠️</span>協力業者（東海エリア）</button>
    <button class="role" style="background:#E8A33D;color:#2B2200" data-r="partner" data-a="関東エリア"><span class="ic">🛠️</span>協力業者（関東エリア）</button>`;
  view.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    if(b.dataset.r==="admin"){ renderAdminPin(); return; }
    setRole({role:b.dataset.r,area:b.dataset.a||""}); renderHome();
  });
}

// 管理者の入室：PASSをサーバー側（Edge Function）で照合する。画面側にはPASSを置かない
function renderAdminPin(){
  view.innerHTML=`<div class="logo">管理者のPASS</div><div class="sub">※一度入室すると12時間は再入力不要です。</div>
    <div class="card"><div class="inner" style="padding-top:14px">
      <input type="text" class="pwmask" id="apin" placeholder="PASSを入力" autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore>
      <button class="btn btn-primary" id="aok">入室する</button><div id="amsg"></div>
      <button class="btn btn-sub" id="aback">戻る</button></div></div>`;
  const go=async()=>{
    const pin=$("#apin").value; if(!pin){ $("#amsg").innerHTML=`<div class="err">PASSを入力してください</div>`; return; }
    const b=$("#aok"); spinBtn(b,"確認中…");
    try{
      await callAdmin(pin,"ping");
      try{ sessionStorage.setItem("felix_pin",pin); }catch(e){}   // 安全検証ツールで再入力しなくて済むように（この画面を閉じるまで）
      setRole({role:"admin",area:"",ts:Date.now()}); renderHome();
    }catch(e){ unspinBtn(b); $("#amsg").innerHTML=`<div class="err">${esc(/PASS|合言葉/.test(e.message)?"PASSが違います":"確認できませんでした。電波の良い場所でもう一度お試しください")}</div>`; }
  };
  $("#aok").onclick=go; $("#apin").onkeydown=e=>{ if(e.key==="Enter") go(); };
  $("#aback").onclick=renderLogin; $("#apin").focus();
}

async function renderHome(){
  const role=getRole(); if(!role){ renderLogin(); return; }
  const admin=role.role==="admin";
  view.innerHTML=`<div class="info">読み込み中…</div>`;
  let h=BRAND;
  document.documentElement.classList.toggle("big",!admin);   // 協力業者は全体を大きく表示
  try{
    if(admin){
      const recs=await sget("inspection_records","select=progress_status&progress_status=in.(確認待ち,是正待ち,是正確認中)");
      const c=s=>recs.filter(r=>r.progress_status===s).length;
      h+=`<div class="cnt"><a href="verify.html" style="background:#E9F0FB"><b style="color:#2E5FA3">${c("確認待ち")}</b><small>確認待ち</small></a>
        <a href="admin.html" style="background:#FDECEC"><b style="color:#D64545">${c("是正待ち")}</b><small>是正待ち</small></a>
        <a href="admin.html" style="background:#FFF6E5"><b style="color:#B8790A">${c("是正確認中")}</b><small>是正確認中</small></a></div>`;
    }else{
      const [recs,ins,props]=await Promise.all([
        sget("inspection_records","select=inspection_id&progress_status=eq.是正待ち"),
        sget("inspections","select=inspection_id,property_id&is_deleted=eq.false"),
        sget("properties","select=property_id,area&is_deleted=eq.false")]);
      const areaOf={}; props.forEach(p=>areaOf[p.property_id]=p.area);
      const inArea=new Set(ins.filter(i=>areaOf[i.property_id]===role.area).map(i=>i.inspection_id));
      const n=recs.filter(r=>inArea.has(r.inspection_id)).length;
      h+=`<div class="cnt one"><a href="partner.html" style="background:#FDECEC;padding:18px"><b style="color:#D64545;font-size:38px">${n}</b><small style="font-size:13px">対応が必要な指摘件数（${esc(role.area||"エリア未設定")}）</small></a></div>`;
    }
  }catch(e){ h+=`<div class="err">件数を読み込めませんでした。電波の良い場所でお試しください。</div>`; }

  // 前回の続き
  let resumeHref="", resumeText="";
  if(admin){
    try{ await IDB.open(); const s=(await IDB.get("meta","session"))?.v; if(s){ resumeHref="inspect.html"; resumeText=`前回の続きから再開する（${s.name} / ${s.type}）`; } }catch(e){}
  }else{
    try{
      const d=JSON.parse(lsGet("felix_partner_session")||"null");
      if(d&&d.prop&&d.type&&d.ts&&(Date.now()-d.ts)<FRESH_MS){
        resumeHref="partner.html#"+new URLSearchParams({p:d.prop,t:d.type}).toString();
        resumeText=`前回の続きから再開する（${d.prop} / ${d.type}）`;
        // 直接開いたとき（メニュー操作ではないとき）は、タップなしで前回の是正画面へ戻る
        if(!isMenuNav && !document.referrer.includes("index.html")){ location.replace(resumeHref); return; }
      }
    }catch(e){}
  }
  if(resumeHref) h+=`<a class="menu resume" href="${esc(resumeHref)}">${esc(resumeText)}</a>`;
  if(admin){
    h+=`<a class="menu main" href="inspect.html"><span class="ic">📷</span><span>新規検査を開始する<small>写真を撮って指摘を登録</small></span></a>
      <div class="grid2">
      <a class="menu" href="properties.html"><span class="ic">🏠</span>物件登録</a>
      <a class="menu" href="verify.html"><span class="ic">✅</span>検査内容確認</a>
      <a class="menu" href="admin.html"><span class="ic">🛠️</span>是正ダッシュボード</a>
      <a class="menu" href="done.html"><span class="ic">📄</span>完了分一覧</a>
      <a class="menu wide" href="safety.html"><span class="ic">🛡️</span>安全検証ツール</a></div>`;
  }else{
    h+=`<a class="menu main" href="partner.html"><span class="ic">🛠️</span><span>新規是正を開始する<small>写真を撮って是正を報告</small></span></a>`;
  }
  if(admin&&OLD_APP_URL) h+=`<a class="menu" style="font-size:13px;padding:10px;color:var(--gray)" href="${esc(OLD_APP_URL)}" target="_blank" rel="noopener">旧アプリ（予備）を開く</a>`;
  h+=`<div class="row"><button class="btn btn-sub" id="logout">ログアウト / アカウントの切り替え</button></div>`;
  view.innerHTML=h;
  $("#logout").onclick=()=>{ clearRole(); lsDel("felix_partner_session"); try{ sessionStorage.removeItem("felix_pin"); }catch(e){} renderLogin(); };
}
renderHome();
</script>
</body>
</html>
